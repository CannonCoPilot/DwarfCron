<title>ECO Wildlife Study</title>


<style>
:root{
  --bg:#F2F4F1; --panel:#FFFFFF; --panel2:#E9EEEA; --ink:#17201C; --ink2:#46524C; --ink3:#717D77;
  --rule:#D6DDD8; --moss:#2E6A4E; --moss-soft:#DDEAE2; --code:#E7ECE8;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --muted:#A3ACA7; --grid:#E3E8E4; --axis:#9AA59F;
  --good:#2F7D4A; --warn:#A06A00; --crit:#B83A39;
  --display:"Archivo", "Avenir Next Condensed", "Arial Narrow", sans-serif;
  --body:"Source Serif 4", Georgia, "Times New Roman", serif;
  --ui:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1512; --panel:#161E1A; --panel2:#1C2621; --ink:#E2E9E5; --ink2:#B2BEB8; --ink3:#8A978F;
  --rule:#27322C; --moss:#7CC39C; --moss-soft:#1E3328; --code:#1D2722;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#2f9a2f; --s7:#9085e9; --s8:#e66767;
  --muted:#5E6A64; --grid:#222C27; --axis:#4E5A54; --good:#6CC08A; --warn:#E0B25A; --crit:#EF7B7A; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0F1512; --panel:#161E1A; --panel2:#1C2621; --ink:#E2E9E5; --ink2:#B2BEB8; --ink3:#8A978F;
  --rule:#27322C; --moss:#7CC39C; --moss-soft:#1E3328; --code:#1D2722;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#2f9a2f; --s7:#9085e9; --s8:#e66767;
  --muted:#5E6A64; --grid:#222C27; --axis:#4E5A54; --good:#6CC08A; --warn:#E0B25A; --crit:#EF7B7A; color-scheme:dark; }
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--bg); color:var(--ink); font:16px/1.6 var(--body); margin:0; padding-inline:clamp(16px,2.4vw,36px); padding-block:24px 80px}
.page{display:grid; grid-template-columns:220px minmax(0,1fr); gap:clamp(20px,2.6vw,44px); max-width:1760px; margin:0 auto}
nav.toc{position:sticky; top:calc(env(safe-area-inset-top,0px) + 16px); align-self:start; max-height:calc(100vh - 32px); overflow:auto; font:500 13px/1.35 var(--ui); padding-right:6px}
nav.toc .tt{font:700 12px/1 var(--ui); letter-spacing:.09em; text-transform:uppercase; color:var(--ink3); margin:0 0 10px}
nav.toc ol{list-style:none; margin:0; padding:0; display:grid; gap:2px}
nav.toc a{display:block; color:var(--ink2); text-decoration:none; padding:4px 8px; border-radius:4px}
nav.toc a:hover{background:var(--panel2); color:var(--ink)}
nav.toc a.on{background:var(--moss-soft); color:var(--moss)}
nav.toc ol ol{padding-left:10px; font-weight:400; font-size:12.5px}
main{display:grid; gap:56px; min-width:0}
h1,h2,h3,h4{font-family:var(--display); text-wrap:balance; margin:0; line-height:1.12; font-stretch:88%}
h1{font-size:clamp(32px,3.6vw,52px); font-weight:800; letter-spacing:-.01em}
h2{font-size:clamp(24px,2.2vw,32px); font-weight:750}
h3{font-size:19px; font-weight:700; margin-top:6px}
h4{font:700 13px/1.3 var(--ui); letter-spacing:.06em; text-transform:uppercase; color:var(--ink3)}
p{margin:0 0 .75em; max-width:70ch}
a{color:var(--moss)}
a:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--moss); outline-offset:2px}
code{font:.82em/1 var(--mono); background:var(--code); padding:2px 5px; border-radius:3px; overflow-wrap:anywhere}
b,strong{font-weight:600}
.eyebrow{font:600 12px/1 var(--ui); letter-spacing:.1em; text-transform:uppercase; color:var(--moss)}
.secnum{font:700 13px/1 var(--mono); color:var(--moss); margin-right:10px}
/* header */
.hero{display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:clamp(20px,3vw,48px); align-items:end; border-bottom:2px solid var(--ink); padding-bottom:22px}
.hero .lede{font-size:18.5px; color:var(--ink2); max-width:62ch}
.hero .meta{font:13px/1.55 var(--ui); color:var(--ink3); display:grid; gap:8px}
.facts{display:flex; flex-wrap:wrap; gap:8px 22px; font:600 13px/1 var(--ui); color:var(--ink2)}
.facts span b{font:700 22px/1 var(--display); color:var(--ink); display:block; margin-bottom:4px; font-stretch:80%}
/* key findings */
.keys{display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:14px}
.key{background:var(--panel); border:1px solid var(--rule); border-radius:6px; padding:14px 16px; display:grid; gap:6px; align-content:start}
.key .claim{font:700 16.5px/1.25 var(--display); font-stretch:90%}
.key p{font-size:14.5px; margin:0; color:var(--ink2)}
.key .src{font:500 11.5px/1 var(--mono); color:var(--ink3)}
/* sections */
section.sec{display:grid; gap:18px; scroll-margin-top:16px}
.sechead{display:grid; gap:8px; border-top:1px solid var(--rule); padding-top:18px}
.sechead .answer{font-size:18px; color:var(--ink2); max-width:80ch}
.split{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.05fr); gap:clamp(18px,2.4vw,40px); align-items:start}
.split > .prose{min-width:0}
.split > .figs{display:grid; gap:16px; min-width:0}
.prose ul,.prose ol{margin:0 0 .9em; padding-left:20px; display:grid; gap:6px; max-width:70ch}
.prose li{padding-left:2px}
.full{min-width:0}
.gallery{display:grid; grid-template-columns:repeat(auto-fill,minmax(420px,1fr)); gap:16px; align-items:start}
.gallery.stack{grid-template-columns:minmax(0,1fr)}
.gallery.wide{grid-template-columns:repeat(auto-fill,minmax(560px,1fr))}
.subsec{display:grid; gap:14px; padding-top:6px}
/* figures */
.fig{margin:0; background:var(--panel); border:1px solid var(--rule); border-radius:6px; padding:14px 16px 12px; display:grid; gap:6px; min-width:0}
.fig .ft{font:700 15px/1.3 var(--display); font-stretch:92%; text-wrap:balance}
.fig .fs{font:13px/1.4 var(--ui); color:var(--ink3)}
.fig .plot{min-height:120px; overflow-x:auto}
.fig .facet-h{font:700 11.5px/1 var(--ui); letter-spacing:.06em; text-transform:uppercase; color:var(--ink3); margin:10px 0 2px}
.fig .plot svg{max-width:100%; height:auto; overflow:visible}
.fig .fc{font:12px/1.45 var(--ui); color:var(--ink3); border-top:1px solid var(--rule); padding-top:6px}
.fig .fn{font:12.5px/1.45 var(--ui); color:var(--ink2)}
.fig details summary{font:500 12px var(--ui); color:var(--moss); cursor:pointer}
.fig .tbl{max-height:280px; overflow:auto; margin-top:6px}
.fig.err .plot{font:13px var(--ui); color:var(--crit)}
/* tables */
.tbl{overflow-x:auto; min-width:0}
table{border-collapse:collapse; width:100%; font:14px/1.45 var(--ui); font-variant-numeric:tabular-nums}
th,td{text-align:left; padding:7px 10px; border-bottom:1px solid var(--rule); vertical-align:top}
thead th{font:700 11.5px/1.25 var(--ui); letter-spacing:.05em; text-transform:uppercase; color:var(--ink3); background:var(--panel); position:sticky; top:0}
td.n,th.n{text-align:right}
.card{background:var(--panel); border:1px solid var(--rule); border-radius:6px; padding:16px 18px}
.note{background:var(--moss-soft); border-radius:6px; padding:12px 16px; font:14.5px/1.5 var(--ui); color:var(--ink)}
.note b{color:var(--moss)}
.caveat{border-left:3px solid var(--warn); padding:4px 0 4px 12px; font:14.5px/1.5 var(--ui); color:var(--ink2)}
/* glossary */
dl.gloss{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:10px 22px; margin:0}
dl.gloss div{display:grid; gap:2px}
dl.gloss dt{font:600 13px/1.3 var(--mono); color:var(--moss)}
dl.gloss dd{margin:0; font:14px/1.45 var(--ui); color:var(--ink2)}
/* open items */
.oi-bar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; font:13px var(--ui)}
.oi-bar button{font:600 12.5px var(--ui); border:1px solid var(--rule); background:var(--panel); color:var(--ink2); padding:6px 11px; border-radius:16px; cursor:pointer}
.oi-bar button[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.oi-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(360px,1fr)); gap:12px}
.oi{background:var(--panel); border:1px solid var(--rule); border-radius:6px; padding:12px 14px; display:grid; gap:6px; align-content:start}
.oi .h{display:flex; gap:8px; align-items:baseline; justify-content:space-between}
.oi .t{font:700 15px/1.3 var(--display); font-stretch:92%}
.oi .d{font:13.5px/1.5 var(--ui); color:var(--ink2); margin:0}
.oi .nx{font:13px/1.45 var(--ui); color:var(--ink)}
.oi .nx b{color:var(--moss)}
.oi .src{font:11.5px/1.4 var(--mono); color:var(--ink3); overflow-wrap:anywhere}
.chip{font:700 10.5px/1 var(--ui); letter-spacing:.06em; text-transform:uppercase; padding:4px 7px; border-radius:10px; white-space:nowrap}
.chip.high{background:color-mix(in srgb,var(--crit) 16%,transparent); color:var(--crit)}
.chip.medium{background:color-mix(in srgb,var(--warn) 18%,transparent); color:var(--warn)}
.chip.low{background:var(--panel2); color:var(--ink3)}
.chip.cat{background:var(--moss-soft); color:var(--moss)}
.oi-cat{display:grid; gap:10px}
.oi-cat > h3 .count{font:600 13px var(--mono); color:var(--ink3); margin-left:8px}
details.appx{background:var(--panel); border:1px solid var(--rule); border-radius:6px; padding:12px 16px}
details.appx summary{font:700 16px var(--display); cursor:pointer}
details.appx[open] summary{margin-bottom:10px}
footer{border-top:1px solid var(--rule); padding-top:14px; font:12.5px/1.5 var(--ui); color:var(--ink3)}
@media (max-width:1180px){ .page{grid-template-columns:1fr} nav.toc{position:static; max-height:none; border-bottom:1px solid var(--rule); padding-bottom:12px} nav.toc ol ol{display:none} nav.toc > ol{display:flex; flex-wrap:wrap; gap:4px} }
@media (max-width:980px){ .hero,.split{grid-template-columns:1fr} .gallery,.gallery.wide{grid-template-columns:1fr} }
@media (max-width:520px){ .oi-grid,.keys{grid-template-columns:1fr} body{font-size:15.5px} }
</style>

<div class="figs" style="display:grid;gap:16px"><figure class="fig" data-fig="size-gate-model" id="fig-size-gate-model"><div class="ft">Under the 5x mass gate, 4 wolves can take a moose but an elephant would need 74 -- while CAL saw 7 wolves kill 3 elephants</div><div class="fs">Hunters a kill needs under the gate (dot) against the group size DF sends (bar), per predator x prey pair; log scale</div><div class="plot"></div><div class="fc">Desk model (builder gate formula); widget pack-size-gate (43733c9d-7906); rig comparison in pk-pack-size and cal-group-size · needed = 1 if mass ratio &lt;= 5 else ceil((ratio/5)^(4/3)). Builder counts floor((cmin+cmax)/2). Not a rig experiment; PK/CAL/GPK show DF&#x27;s combat ignores prey mass.</div><details><summary>Data (12 rows)</summary><div class="tbl"><table><thead><tr><th>pair</th><th class=n>pm</th><th class=n>qm</th><th class=n>cmin</th><th class=n>cmax</th><th class=n>hunters_needed</th><th class=n>group_counted</th><th>edge_written</th></tr></thead><tbody><tr><td>wolf on deer</td><td class=n>40000</td><td class=n>140000</td><td class=n>3</td><td class=n>7</td><td class=n>1</td><td class=n>5</td><td>True</td></tr><tr><td>wolf on elk</td><td class=n>40000</td><td class=n>300000</td><td class=n>3</td><td class=n>7</td><td class=n>2</td><td class=n>5</td><td>True</td></tr><tr><td>wolf on moose</td><td class=n>40000</td><td class=n>525000</td><td class=n>3</td><td class=n>7</td><td class=n>4</td><td class=n>5</td><td>True</td></tr><tr><td>wolf on water buffalo</td><td class=n>40000</td><td class=n>1000000</td><td class=n>3</td><td class=n>7</td><td class=n>9</td><td class=n>5</td><td>False</td></tr><tr><td>wolf on elephant</td><td class=n>40000</td><td class=n>5000000</td><td class=n>3</td><td class=n>7</td><td class=n>74</td><td class=n>5</td><td>False</td></tr><tr><td>lion on giraffe</td><td class=n>200000</td><td class=n>1000000</td><td class=n>1</td><td class=n>3</td><td class=n>1</td><td class=n>2</td><td>True</td></tr>   }
  refs.forEach((rf, ri) => { const vv = rf.value; const horizontal = ['bar','dot','dumbbell','box','strip','stackedBar','range'].includes(form) && (form !== 'bar' || cats.length > 5 || longest(cats) > 9);
    if (horizontal){ marks.push(Plot.ruleX([vv], {stroke:C.ink3, strokeDasharray:'4,3'}), Plot.text([vv], {x:d => d, frameAnchor:'top', dy:-2 + ri * 12, text:() => rf.label, fill:C.ink3, fontSize:10.5, textAnchor:'start', dx:4})); }
    else { marks.push(Plot.ruleY([vv], {stroke:C.ink3, strokeDasharray:'4,3'}), Plot.text([vv], {y:d => d, frameAnchor:'right', dy:-6, text:() => rf.label, fill:C.ink3, fontSize:10.5, textAnchor:'end'})); } });
  if (fct){ opt.fy = undefined; }
  return Plot.plot({...base, ...opt, color: color || undefined, marks});
}

function tableOf(spec){
  const rows = spec.rows || []; if (!rows.length) return '<p>No rows.</p>';
  const keys = Object.keys(rows[0]).filter(k => !k.startsWith('_'));
  const esc = v => String(v == null ? '' : v).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  return '<table><thead><tr>' + keys.map(k => `<th${typeof rows[0][k] === 'number' ? ' class="n"' : ''}>${esc(k)}</th>`).join('') + '</tr></thead><tbody>' +
    rows.map(r => '<tr>' + keys.map(k => `<td${typeof r[k] === 'number' ? ' class="n"' : ''}>${esc(typeof r[k] === 'number' ? fmt(r[k]) : r[k])}</td>`).join('') + '</tr>').join('') + '</tbody></table>';
}

function render(el){
  const spec = BYID[el.dataset.fig]; if (!spec) { el.remove(); return; }
  const plot = el.querySelector('.plot'); if (!plot) return;
  const w = Math.max(280, Math.floor(plot.clientWidth || el.clientWidth - 32));
  if (el._w === w && el._theme === document.documentElement.dataset.theme + matchMedia('(prefers-color-scheme: dark)').matches) return;
  el._w = w; el._theme = document.documentElement.dataset.theme + matchMedia('(prefers-color-scheme: dark)').matches;
  plot.innerHTML = '';
  if (spec.form === 'table' || typeof Plot === 'undefined'){ plot.innerHTML = '<div class="tbl">' + tableOf(spec) + '</div>'; return; }
  try {
    const fv = spec.facet ? [...new Set((spec.rows || []).map(r => r[spec.facet]))] : [];
    if (fv.length > 1 && fv.length <= 6){
      // one small panel per facet value, same scales' domains for the categories
      for (const v of fv){
        const h = document.createElement('div'); h.className = 'facet-h'; h.textContent = v; plot.appendChild(h);
        const sub = Object.assign({}, spec, {rows: spec.rows.filter(r => r[spec.facet] === v), facet: null,
                                              seriesOrder: spec.series ? [...new Set(spec.rows.map(r => r[spec.series]))] : undefined});
        const node = build(sub, w); if (node){ node.setAttribute('role','img'); node.setAttribute('aria-label', (spec.title || '') + ' — ' + v); plot.appendChild(node); }
      }
    } else {
      const node = build(spec, w); if (node){ node.setAttribute('role','img'); node.setAttribute('aria-label', spec.title || ''); plot.appendChild(node); } else plot.innerHTML = '<div class="tbl">' + tableOf(spec) + '</div>';
    }
  }
  catch(e){ el.classList.add('err'); plot.innerHTML = '<div class="tbl">' + tableOf(spec) + '</div>'; console.warn('figure', spec.id, e); }
}
const all = () => document.querySelectorAll('.fig[data-fig]');
function renderAll(force){ all().forEach(el => { if (force) el._w = 0; render(el); }); }
if (typeof ResizeObserver !== 'undefined'){ const ro = new ResizeObserver(es => es.forEach(e => render(e.target.closest('.fig')))); all().forEach(el => ro.observe(el.querySelector('.plot') || el)); }
renderAll(true);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => renderAll(true));
      new MutationObserver(() => renderAll(true)).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']}); } catch(e){}

/* open items filter */
const bar = document.querySelector('.oi-bar');
if (bar){
  const items = [...document.querySelectorAll('.oi')];
  let pr = 'all';
  bar.addEventListener('click', ev => { const b = ev.target.closest('button'); if (!b) return;
    pr = b.dataset.p; bar.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
    items.forEach(it => { it.hidden = !(pr === 'all' || it.dataset.p === pr); });
    document.querySelectorAll('.oi-cat').forEach(c => { c.hidden = !c.querySelector('.oi:not([hidden])'); });
  });
}
/* toc highlight */
const links = [...document.querySelectorAll('nav.toc a')]; const map = new Map(links.map(a => [a.getAttribute('href').slice(1), a]));
if ('IntersectionObserver' in window){ const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ links.forEach(a => a.classList.remove('on')); const a = map.get(e.target.id); if (a) a.classList.add('on'); } }), {rootMargin:'-10% 0px -80% 0px'});
  document.querySelectorAll('section.sec[id], .subsec[id]').forEach(s => io.observe(s)); }
})();
</script>

o.push(el.dataset.fig+' err='+el.classList.contains('err')+' svgs='+el.querySelectorAll('.plot svg').length+' circles='+el.querySelectorAll('.plot circle').length+' rects='+el.querySelectorAll('.plot rect').length+' paths='+el.querySelectorAll('.plot path').length+' table='+!!el.querySelector('.plot table')+(sv?' w='+sv.getAttribute('width')+' h='+sv.getAttribute('height'):'')+' yticks='+[...el.querySelectorAll('[aria-label="y-axis tick label"] text')].map(t=>t.textContent).slice(0,12).join('|')+' xticks='+[...el.querySelectorAll('[aria-label="x-axis tick label"] text')].map(t=>t.textContent).slice(0,12).join('|'))});
