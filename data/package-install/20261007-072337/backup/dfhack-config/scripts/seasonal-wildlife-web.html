<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wildlife Companion</title>
<style>
:root{
  --bg:#f1f4f1; --surface:#ffffff; --surface-2:#e8ede9; --surface-3:#dde4df;
  --ink:#16201b; --ink-2:#48574f; --muted:#6f7d75; --line:#d3dbd5; --line-2:#bfc9c2;
  --accent:#5a42b3; --accent-ink:#ffffff; --accent-soft:#ebe7f8;
  --land:#eb6834; --water:#2a78d6; --cavern:#1baf7a; --deep:#8a5a9e;
  --good:#2e7d3f; --warn:#a86f00; --crit:#c2302d;
  --good-soft:#e2f1e5; --warn-soft:#f8eed7; --crit-soft:#f8e1e0;
  --lvH:#3f9a52; --lvC:#e08a1e; --lvA:#d23b34; --lvV:#8a8f8c;
  --edge:#8b978f; --mapbg:#d9dfd9;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101412; --surface:#171c19; --surface-2:#1f2622; --surface-3:#29312c;
    --ink:#edf2ee; --ink-2:#b6c2bb; --muted:#8a978f; --line:#2b342f; --line-2:#3a453f;
    --accent:#a595ef; --accent-ink:#15112a; --accent-soft:#2a2545;
    --land:#e0703c; --water:#3f8fe8; --cavern:#22b585; --deep:#b07cc6;
    --good:#5cb870; --warn:#e0a53a; --crit:#ec6b67;
    --good-soft:#1b2d20; --warn-soft:#33290f; --crit-soft:#3a1c1b;
    --lvH:#5cb870; --lvC:#eba04a; --lvA:#ec6b67; --lvV:#8a978f;
    --edge:#76837b; --mapbg:#0c0f0d;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101412; --surface:#171c19; --surface-2:#1f2622; --surface-3:#29312c;
  --ink:#edf2ee; --ink-2:#b6c2bb; --muted:#8a978f; --line:#2b342f; --line-2:#3a453f;
  --accent:#a595ef; --accent-ink:#15112a; --accent-soft:#2a2545;
  --land:#e0703c; --water:#3f8fe8; --cavern:#22b585; --deep:#b07cc6;
  --good:#5cb870; --warn:#e0a53a; --crit:#ec6b67;
  --good-soft:#1b2d20; --warn-soft:#33290f; --crit-soft:#3a1c1b;
  --lvH:#5cb870; --lvC:#eba04a; --lvA:#ec6b67; --lvV:#8a978f;
  --edge:#76837b; --mapbg:#0c0f0d;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;padding:0 16px 64px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1440px;margin:0 auto}
.sub{color:var(--muted);font-size:12.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
h2{font-size:12.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:0 0 10px}
h3{margin:0;font-size:15px;font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.fam{background:transparent;border:1px dashed var(--line-2)}
.btn{border:1px solid var(--line-2);background:var(--surface);padding:5px 11px;border-radius:7px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:3px 8px;font-size:12px}
.btn.danger{border-color:color-mix(in oklab,var(--crit) 50%,transparent);color:var(--crit)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:2px;font-size:inherit}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot.land{background:var(--land)} .dot.water{background:var(--water)} .dot.cavern{background:var(--cavern)} .dot.deep{background:var(--deep)}
.lvH{background:var(--lvH)} .lvC{background:var(--lvC)} .lvA{background:var(--lvA)} .lvV{background:var(--lvV)}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted);background:var(--surface)}
table{border-collapse:collapse;width:100%}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.tscroll{overflow-x:auto}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--bg);margin:0 -16px;padding:10px 16px 0;border-bottom:1px solid var(--line)}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.fort{display:flex;align-items:baseline;gap:10px;min-width:0}
.fort h1{font-family:var(--serif);font-weight:500;font-size:27px;line-height:1;margin:0}
.fort .tool{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.clock{display:flex;align-items:center;gap:9px;color:var(--ink-2)}
.clock b{color:var(--ink);font-weight:600}
.conn{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);background:var(--warn-soft);border:1px solid color-mix(in oklab,var(--warn) 35%,transparent);padding:4px 10px;border-radius:999px;white-space:nowrap}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block}
.conn.live{background:var(--good-soft);border-color:color-mix(in oklab,var(--good) 35%,transparent)} .conn.live i{background:var(--good);animation:beat 2s infinite}
.conn.paused{background:var(--surface-2);border-color:var(--line-2)} .conn.paused i{background:var(--muted)}
.conn.mock{background:var(--surface-2);border-color:var(--line-2)} .conn.mock i{background:var(--muted);animation:none}
.conn.lost{background:var(--crit-soft);border-color:color-mix(in oklab,var(--crit) 35%,transparent)} .conn.lost i{background:var(--crit)}
@keyframes beat{0%,100%{opacity:1}50%{opacity:.35}}
.age{font-family:var(--mono);font-size:11px;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg[hidden]{display:none}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:6px;font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .14)}
.seg.small button{padding:2px 8px;font-size:12px}
.search{position:relative}
.search input{width:210px;max-width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:5px 10px 5px 28px}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted)}
.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto;scrollbar-width:thin}
.tabs button{border:0;background:transparent;padding:8px 12px 9px;font-size:14px;font-weight:500;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .count{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:5px}
.tabs .badge{display:inline-block;min-width:16px;padding:0 4px;margin-left:5px;border-radius:8px;background:var(--crit);color:#fff;font-size:10.5px;font-weight:700;text-align:center}
main{padding-block:16px}
section[role="tabpanel"]{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
section[role="tabpanel"][hidden]{display:none}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:14px}
@media (max-width:960px){.grid2{grid-template-columns:minmax(0,1fr)}}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--ink-2)}
.banner.warn{border-color:color-mix(in oklab,var(--warn) 50%,transparent);background:var(--warn-soft)}
.banner.crit{border-color:color-mix(in oklab,var(--crit) 50%,transparent);background:var(--crit-soft)}
.banner b{color:var(--ink)}

/* overview */
.lcard{display:grid;gap:10px}
.lhead{display:flex;align-items:center;gap:8px}
.lhead .chip:last-child{margin-left:auto}
.big{font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.kpis{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end}
.kpi .lab{font-size:11.5px;color:var(--muted)}
.pips{display:flex;gap:3px}
.pips i{flex:1;height:7px;border-radius:3px;background:var(--surface-3);min-width:6px}
.spark{display:block;width:100%;height:46px}
.feed{list-style:none;margin:0;padding:0;display:grid}
.feed li{display:grid;grid-template-columns:92px 22px minmax(0,1fr);gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.feed li:last-child{border-bottom:0}
.feed .ic{font-family:var(--mono);font-weight:700;text-align:center}
.ic.arrive{color:var(--good)} .ic.leave{color:var(--muted)} .ic.kill{color:var(--crit)} .ic.died{color:var(--muted)} .ic.edit{color:var(--accent)}
.alerts{display:grid;gap:8px}
.minimap{display:block;width:100%;height:auto;aspect-ratio:var(--ar,1);border-radius:8px;cursor:pointer;image-rendering:pixelated;background:var(--mapbg)}

/* map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
@media (max-width:1000px){.mapwrap{grid-template-columns:minmax(0,1fr)}}
.mapbox{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--mapbg);aspect-ratio:var(--ar,1);min-height:360px}
.mapbox canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
.mapbox canvas.drag{cursor:grabbing}
.maptools{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;max-width:calc(100% - 20px)}
.maptools .seg{background:color-mix(in oklab,var(--surface) 88%,transparent);box-shadow:0 1px 3px rgb(0 0 0 / .2)}
.mapstat{position:absolute;left:10px;bottom:10px;font-size:11.5px;font-family:var(--mono);color:#e9efe9;background:rgb(0 0 0 / .55);padding:3px 8px;border-radius:6px;pointer-events:none}
.maptip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:6px 9px;font-size:12px;box-shadow:0 4px 14px rgb(0 0 0 / .22);display:none;z-index:4;max-width:260px}
.zoom{position:absolute;right:10px;top:10px;display:grid;gap:4px}
.zoom button{width:30px;height:30px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);font-size:16px;line-height:1}
.legend{display:flex;gap:10px 14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.glist{display:grid;gap:4px;max-height:calc(100vh - 420px);min-height:160px;overflow:auto}
.gitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid transparent;border-radius:8px;padding:5px 6px;background:none;text-align:left;font-size:13px;width:100%}
.gitem:hover{background:var(--surface-2)}
.gitem[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.gitem .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:capitalize}
.checks{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:12.5px}
.checks label{display:inline-flex;gap:5px;align-items:center;cursor:pointer}

/* groups */
.gcard{display:grid;gap:10px}
.grow{display:grid;grid-template-columns:minmax(150px,1.3fr) 60px minmax(90px,1fr) minmax(120px,1.1fr) auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.grow:first-of-type{border-top:0}
@media (max-width:760px){.grow{grid-template-columns:1fr 1fr}}
.cd{position:relative;height:7px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.cd span{position:absolute;left:0;top:0;bottom:0;background:var(--ink-2);opacity:.6;border-radius:4px}
.cd span.held{background:var(--accent);opacity:.9}
.gname{display:flex;gap:7px;align-items:center;min-width:0}
.gname b{font-weight:550;text-transform:capitalize;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* species */
.split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(340px,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.split{grid-template-columns:1fr}}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.filters select,.sel{background:var(--surface);border:1px solid var(--line-2);border-radius:7px;padding:4px 8px;font-size:13px}
.list{max-height:calc(100vh - 230px);min-height:420px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.list table th{position:sticky;top:0;background:var(--surface);z-index:1;cursor:pointer;user-select:none}
.list table th[aria-sort="ascending"]::after{content:" ▲";font-size:9px}
.list table th[aria-sort="descending"]::after{content:" ▼";font-size:9px}
.list tbody tr{cursor:pointer}
.list tbody tr:hover{background:var(--surface-2)}
.list tbody tr[aria-selected="true"]{background:var(--accent-soft)}
.list tbody tr.inactive td{color:var(--muted)}
.name{display:flex;align-items:center;gap:8px;font-weight:500;white-space:nowrap}
.seasons{display:inline-grid;grid-template-columns:repeat(4,13px);gap:2px}
.seasons i{height:11px;border-radius:2px;background:var(--surface-3)}
.seasons i.on{background:var(--ink-2)}
.seasons i.now{outline:1.5px solid var(--accent);outline-offset:1px}
.switch{position:relative;width:34px;height:20px;border-radius:999px;border:0;background:var(--surface-3);padding:0;flex:none}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgb(0 0 0 / .25);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--good)}
.switch[aria-checked="true"]::after{transform:translateX(14px)}
.detail{position:sticky;top:150px;display:grid;gap:14px;max-height:calc(100vh - 170px);overflow:auto}
.dhead h3{font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.05;text-transform:capitalize}
.readings{display:flex;flex-wrap:wrap;gap:5px}
.field{display:grid;gap:6px}
.field>label,.field>.lab{font-size:11.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.seasonbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seasonbtns button{border:1px solid var(--line-2);background:var(--surface);padding:6px 4px;border-radius:7px;font-size:13px}
.seasonbtns button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.seasonbtns button.now{box-shadow:inset 0 -3px 0 var(--accent)}
.stepper{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden}
.stepper button{border:0;background:var(--surface-2);width:28px}
.stepper input{width:84px;border:0;text-align:center;background:var(--surface);padding:4px;font-family:var(--mono);font-size:13px}
input[type=range]{accent-color:var(--accent);width:100%}
.ego{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ego h4{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.blist{display:flex;flex-wrap:wrap;gap:5px}
.elink{border:0;background:var(--surface-2);border-radius:6px;padding:2px 7px;text-align:left;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;min-width:0;text-transform:capitalize;max-width:100%}
.elink .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.elink:hover{background:var(--surface-3)}
.elink.live{box-shadow:inset 3px 0 0 var(--accent)}
.elink.kill{box-shadow:inset 3px 0 0 var(--crit)}
.more{font-size:12px;color:var(--muted)}
.why{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:8px 10px}
.pre{margin:0;max-height:260px;overflow:auto;background:var(--surface-2);border-radius:8px;padding:8px 10px;font-family:var(--mono);font-size:11.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.refuse{font-size:12.5px;color:var(--crit)}
.num-in{width:90px;background:var(--surface);border:1px solid var(--line-2);border-radius:7px;padding:4px 6px;font-family:var(--mono);font-size:12.5px;text-align:right}

/* food web, seasons */
.svgbox{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.svgbox svg{display:block}
.svgbox text{font-family:var(--sans);fill:var(--ink)}
.wn{cursor:pointer}
.wn:hover text{text-decoration:underline}
.we{fill:none;stroke:var(--edge);stroke-opacity:.28;stroke-width:1}
.we.held{stroke:var(--accent);stroke-opacity:.8;stroke-width:1.8}
.we.kill{stroke:var(--crit);stroke-opacity:.9}
.focus .we{stroke-opacity:.06}
.focus .we.on{stroke-opacity:1}
.focus .wn{opacity:.3}
.focus .wn.on{opacity:1}
.matrix td,.matrix th{text-align:center;padding:3px 4px;font-size:12px}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.mx{display:inline-block;width:20px;height:14px;border-radius:3px;background:var(--surface-3);font-family:var(--mono);font-size:11px;line-height:14px;font-weight:700}
.mx.on{background:color-mix(in oklab,var(--ink-2) 55%,transparent);color:var(--surface)}
.mx.in{background:var(--good);color:#fff}
.mx.out{background:color-mix(in oklab,var(--crit) 70%,transparent);color:#fff}
.now-col{background:var(--accent-soft)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{fill:var(--muted);font-size:10.5px;font-family:var(--mono)}
.chart .gl{stroke:var(--line);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:7px 9px;font-size:12px;box-shadow:0 4px 14px rgb(0 0 0 / .15);min-width:140px;display:none;z-index:5}

/* roster */
.pyr{display:grid;gap:8px}
.pyrrow{display:grid;grid-template-columns:86px minmax(0,1fr);gap:4px 10px;align-items:center;font-size:12.5px}
.pyrbar{position:relative;height:15px;border-radius:4px;overflow:hidden;display:flex;background:var(--surface-2)}
.pyrbar span{display:block;height:100%}
.pyrbar.target{height:7px;opacity:.75}
.guild{display:grid;grid-template-columns:140px minmax(0,1fr);gap:10px;align-items:start;padding:6px 0;border-bottom:1px dashed var(--line)}
.guild:last-child{border-bottom:0}
.guild .gn b{font-family:var(--mono);font-size:12px;margin-right:6px}

/* waters & caverns */
.wcard{display:grid;gap:10px;align-content:start}
.grid3{align-items:start}
.ctxctl .crow{grid-template-columns:minmax(0,1fr) auto}
.ctxctl .crow .cl .h{display:none}
.lvbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface-2)}
.lvbar span{display:block;height:100%}
.phase{font-family:var(--mono);font-size:12px}
.pbar{position:relative;height:9px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.pbar span{position:absolute;left:0;top:0;bottom:0;background:var(--cavern)}
.pbar i{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--crit)}
.ctxctl{display:grid;gap:0;border-top:1px dashed var(--line);padding-top:6px}

/* controls */
.ctlwrap{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.ctlwrap{grid-template-columns:minmax(0,1fr)}}

<script>
(() => {
'use strict';
// seasonal-wildlife companion, web2 (v7.1, docs/v7.1/web2-design.md). Served by `seasonal-wildlife-web` inside DFHack on
// 127.0.0.1; every request carries the token in this page's address. Feeds: /state.json (2 s, ETag/304),
// /map.json (1.5 s while a map is on screen; terrain only when its version moves), /history.json?since= and
// /events.json?since= (cursors), /web.json, /waters.json, /status.json, /species.json and /controls.json on demand.
// Writes: /set /act /read /cmd, each one tool console verb, with the game's reply and an Undo.
const TOKEN = new URLSearchParams(location.search).get('t') || '';
const SEASONS = ['Spring', 'Summer', 'Autumn', 'Winter'], SHORT = ['Sp', 'Su', 'Au', 'Wi'];
const LAYERS = ['land', 'water', 'cavern'];
const LNAME = { land: 'Land', water: 'Water', cavern: 'Caverns', deep: 'Deep' };
const LCODE = ['land', 'water', 'cavern', 'deep'];
const LVNAME = { A: 'apex', C: 'carnivore', H: 'herbivore', V: 'vermin' };
const FAM = { fish: 'fish', flies: 'flies & biting insects', fliers: 'flying insects', mammals: 'rodents & small mammals',
              soil: 'worms & soil life', colony: 'colony insects', crawlers: 'crawlers' };
const TPD = 1200;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => Math.round(n || 0).toLocaleString('en-US');
const arr = x => Array.isArray(x) ? x : [];          // DFHack's encoder writes an empty table as {}
const obj = x => (x && typeof x === 'object' && !Array.isArray(x)) ? x : {};
const dfix = (v, n = 1) => v == null ? '—' : (+v).toFixed(n);
const store = { get(k, d) { try { const v = localStorage.getItem('swc2.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem('swc2.' + k, JSON.stringify(v)); } catch { /* private window */ } } };
const ordinal = n => n + (n % 10 === 1 && n !== 11 ? 'st' : n % 10 === 2 && n !== 12 ? 'nd' : n % 10 === 3 && n !== 13 ? 'rd' : 'th');
const url = (p, q = {}) => { const u = new URLSearchParams({ t: TOKEN }); for (const [k, v] of Object.entries(q)) if (v != null && v !== '') u.set(k, String(v)); return p + '?' + u.toString(); };
const withTok = u => u && u.startsWith('/') ? u + (u.includes('?') ? '&' : '?') + 't=' + encodeURIComponent(TOKEN) : u;

function dayLabel(d) { if (d == null) return '—'; const yd = ((d % 336) + 336) % 336; return `${SHORT[Math.floor(yd / 84)]} ${Math.floor(yd % 84) + 1}`; }

// ---------------------------------------------------------------- the data
let D = { species: [], pairs: [], live: [] }, SP = [], BY = {}, BYTOK = {}, OTHERS = {}, eats = {}, eatenBy = {}, onMap = {}, LIM = {}, DATE = {}, NOW = 0, GFX = null;
const MAP = { tv: null, wv: null, terrain: null, water: null, caves: {}, cv: {}, live: null, links: [], linksSkipped: null, at: 0 };
const HIST = { seq: 0, samples: [], events: [], period: 0.25 };
const LED = { seq: 0, entries: [], kinds: [], fresh: new Set() };
let WEB = null, WATERS = null, CTL = null, CTLBY = {}, STATUS = {}, STATUS_AT = {};
const SPEC_DETAIL = {};
function ingest(d) {
  D = d;
  SP = arr(d.species).map(s => ({ ...s, seasons: arr(s.seasons), role: s.role || 'prey' }));
  BY = Object.fromEntries(SP.map(s => [s.key, s]));
  BYTOK = {}; for (const s of SP) if (!BYTOK[s.token]) BYTOK[s.token] = s;
  // creatures off the managed roster (cavern natives, the deep, a killed pet): the server sends their glyph and sprite
  OTHERS = {}; for (const [t, o] of Object.entries(obj(d.others))) OTHERS[t] = { ...obj(o), token: t, key: t, offRoster: true, name: (o && o.name) || t.toLowerCase().replace(/_/g, ' ') };
  eats = {}; eatenBy = {};
  for (const [p, q] of arr(d.pairs)) { if (!BY[p] || !BY[q]) continue; (eats[p] ||= []).push(q); (eatenBy[q] ||= []).push(p); }
  if (!MAP.live || Date.now() - MAP.at > 10000) { onMap = {}; for (const s of SP) if (s.on_map > 0) onMap[s.key] = s.on_map; }
  LIM = obj(d.limits); DATE = obj(d.date); NOW = DATE.season ?? 0;
  if (d.gfx && obj(d.gfx).pages && Object.keys(obj(d.gfx.pages)).length) { GFX = d.gfx; prepareFont(); }
  $('toolTag').textContent = 'seasonal-wildlife' + (d.release ? ' ' + d.release : '') + ' · web ' + (d.web || 2) + (d.dfhack ? ' · DFHack ' + d.dfhack : '') + (d.mock ? (d.mock.fixture ? ' · offline replay' : ' · offline sim') : '');
  $('toolTag').title = [d.df ? 'DF ' + d.df : '', d.dfhack ? 'DFHack ' + d.dfhack : '', d.fort ? 'fort ' + d.fort : '', d.save ? 'save ' + d.save : ''].filter(Boolean).join(' · ');
}
const isVermin = s => s && s.role === 'vermin';
// a group's or a unit's key as the roster keys it: a land-listed aquatic drawn into the water is 'water:TOKEN' on the map
// and 'TOKEN' on the roster (R45); the species is the same, so the page joins them by token
function normKey(k) { if (!k || BY[k]) return k; const t = String(k).replace(/^(water|cavern|deep):/, ''); return BYTOK[t] ? BYTOK[t].key : k; }
const levelOf = s => !s ? 'H' : isVermin(s) ? 'V' : (s.level || (s.role === 'predator' ? 'C' : 'H'));
const nm = s => esc(s ? s.name : '?');
const tokOf = k => String(k || '').replace(/^\w+:/, '');
// the roster's species for a key, else the off-roster creature by token, else a stub that still draws a glyph
function spAny(key) {
  if (BY[key]) return BY[key];
  const t = tokOf(key);
  return BYTOK[t] || OTHERS[t] || OTHERS[t.replace(/_/g, ' ')] || { key, token: t, name: t.toLowerCase().replace(/_/g, ' '), offRoster: true };
}
const keyName = k => spAny(k).name;
const tokName = t => spAny(t).name;
function inSeason(s, k = NOW) { return s.active && s.seasons.includes(k); }
const layerOk = s => st.layer === 'all' || (s && s.layer === st.layer);

// ---------------------------------------------------------------- creature tiles: DF's sprites or its ASCII glyph
const CP437 = ' ☺☻♥♦♣♠•◘○◙♂♀♪♫☼►◄↕‼¶§▬↨↑↓→←∟↔▲▼' + Array.from({ length: 95 }, (_, i) => String.fromCharCode(32 + i)).join('') + '⌂'
  + 'ÇüéâäàåçêëèïîìÄÅÉæÆôöòûùÿÖÜ¢£¥₧ƒáíóúñÑªº¿⌐¬½¼¡«»░▒▓│┤╡╢╖╕╣║╗╝╜╛┐└┴┬├─┼╞╟╚╔╩╦╠═╬╧╨╤╥╙╘╒╓╫╪┘┌█▄▌▐▀αßΓπΣσµτΦΘΩδ∞φε∩≡±≥≤⌠⌡÷≈°∙·√ⁿ²■ ';
const cpChar = n => [...CP437][n] || '?';
const DFPAL = ['#000000', '#000080', '#008000', '#008080', '#800000', '#800080', '#808000', '#c0c0c0', '#808080', '#0000ff', '#00ff00', '#00ffff', '#ff0000', '#ff00ff', '#ffff00', '#ffffff'];
let MASK = null, MASKFOR = '';
function prepareFont() {
  const f = GFX && GFX.font; if (!f || !f.url || MASKFOR === f.url) return;
  MASKFOR = f.url;

    const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
    const x = c.getContext('2d'); x.drawImage(img, 0, 0);
    const d = x.getImageData(0, 0, c.width, c.height), p = d.data;
    for (let i = 0; i < p.length; i += 4) { const r = p[i], g = p[i + 1], b = p[i + 2], mg = r > 200 && g < 60 && b > 200; const a = mg ? 0 : Math.min(p[i + 3], Math.max(r, g, b)); p[i] = p[i + 1] = p[i + 2] = 255; p[i + 3] = a; }
    x.putImageData(d, 0, 0);

function tile(s, h = 22, big = false) {
  if (!s) return `<span class="tile none" style="width:${h}px;height:${h}px"></span>`;
  if (st.tiles === 'steam' && GFX && s.gfx) {
    const g = s.gfx, useBig = big && g.p, pg = obj(GFX.pages)[useBig ? g.p : (g.ip || g.p)];
    if (pg) {
      const tw = pg.tw || 32, th = pg.th || 32;
      const tx = useBig ? g.x : (g.ip ? g.ix : g.x), ty = useBig ? g.y : (g.ip ? g.iy : g.y);
      const wt = useBig ? (g.w || 1) : 1, ht = useBig ? (g.h || 1) : 1, k = h / (ht * th);
      return `<span class="tile" role="img" aria-label="${esc(s.name)}" style="width:${wt * tw * k}px;height:${h}px;background-image:url('${withTok(pg.url)}');background-size:${pg.w * k}px ${pg.h * k}px;background-position:${-tx * tw * k}px ${-ty * th * k}px"></span>`;
    }
  }

  const pal = arr(GFX && GFX.palette).length === 16 ? GFX.palette : DFPAL, fg = pal[a.fg + (a.br ? 8 : 0)] || '#c0c0c0', bg = pal[a.bg] || '#000';
  const gw = MASK ? MASK.gw : 8, gh = MASK ? MASK.gh : 12, k = h / gh, w = Math.round(gw * k);

  return `<span class="tile ascii" role="img" aria-label="${esc(s.name)}" style="width:${w}px;height:${h}px;background:${bg}"><i style="background:${fg};-webkit-mask:${m};mask:${m}"></i></span>`;

const spLink = (key, cls = '') => { const s = spAny(key); return `<button class="elink ${cls}" data-insp="sp:${esc(key)}" title="${esc(s.name)}${s.offRoster ? ' (not on the managed roster)' : ''}">${tile(s, 16)}<span class="t">${esc(s.name)}</span></button>`; };

// ---------------------------------------------------------------- ui state
const st = {
  tab: 'overview', layer: store.get('layer', 'all'), tiles: store.get('tiles', 'steam'), q: '', sel: null, insp: null,
  sort: { k: 'onmap', dir: -1 }, fActive: 'all', fRole: 'all', fNow: false, fMap: false,
  webSeason: null, webScope: store.get('webScope', 'map'), webFocus: null, conOpen: false, cmds: [],
  csec: store.get('csec', null), cq: '', readouts: {}, lkind: 'all', llayer: 'all', lq: '',
  mapView: 'surface', mapShow: store.get('mapShow', { units: true, labels: true, kills: true, links: false }), mapSel: null,
  histRange: 7,
};

// ---------------------------------------------------------------- the connection: one scheduler, backoff, freshness
const CONN = { state: 'connecting', ok: 0, fails: 0, retryAt: 0, lastDate: null, dateAt: 0, etag: null, lastText: null, why: '' };
async function getJSON(path, q, opts = {}) {
  const r = await fetch(url(path, q), { cache: 'no-store', headers: opts.headers || {} });
  if (r.status === 403) { const e = new Error('token'); e.token = true; throw e; }
  if (r.status === 304) return { notModified: true, etag: r.headers.get('ETag') };

}
const FEEDS = {
  state:  { every: 2000, need: () => true, run: pollState },
  map:    { every: 1500, need: () => ['map', 'groups', 'overview', 'waters', 'species', 'web'].includes(st.tab) || !!st.insp, run: pollMap },
  hist:   { every: 15000, need: () => true, run: pollHist },

function drawHistory(el) {

  const S = HIST.samples.filter(x => x.t >= end - st.histRange);
  if (S.length < 2) { el.innerHTML = '<p class="sub" style="margin:8px 0">The line starts after the second sample (a quarter day of game time). Unpause the game.</p>'; return; }
  const W = 640, Hh = 240, m = { l: 34, r: 14, t: 10, b: 52 }, t0 = S[0].t, t1 = S[S.length - 1].t, span = Math.max(1e-6, t1 - t0);

  const x = t => m.l + (t - t0) / span * (W - m.l - m.r), y = v => Hh - m.b - v / ymax * (Hh - m.t - m.b);

  g += [0, .25, .5, .75, 1].map(f => `<text class="ax" x="${x(t0 + f * span)}" y="${Hh - m.b + 14}" text-anchor="middle">${dayLabel(t0 + f * span)}</text>`).join('');
  for (const l of ls) g += `<path d="${S.map((p, i) => (i ? 'L' : 'M') + x(p.t).toFixed(1) + ' ' + y(obj(p.w)[l] || 0).toFixed(1)).join(' ')}" fill="none" stroke="var(--${l})" stroke-width="2"/>`;
  const lanes = { arrive: [Hh - 26, 'var(--good)', '▲'], leave: [Hh - 15, 'var(--muted)', '▼'], kill: [Hh - 4, 'var(--crit)', '✕'] };
  for (const e of HIST.events) { const L = lanes[e.k]; if (!L || e.t < t0 || e.t > t1) continue; g += `<text x="${x(e.t)}" y="${L[0]}" font-size="9" fill="${L[1]}" text-anchor="middle">${L[2]}</text>`; }

  el.querySelector('#hhit').addEventListener('pointermove', ev => {

    let best = S[0]; for (const p of S) if (Math.abs(p.t - tx) < Math.abs(best.t - tx)) best = p;
    hx.setAttribute('x1', x(best.t)); hx.setAttribute('x2', x(best.t)); hx.setAttribute('opacity', 1);
    const evs = HIST.events.filter(e => Math.abs(e.t - best.t) <= HIST.period / 2);
    tip.innerHTML = `<div class="sub">${dayLabel(best.t)} ${String(Math.floor((best.t % 1) * 24)).padStart(2, '0')}h</div>` + ls.map(l => `<div class="row" style="justify-content:space-between"><span><i class="dot ${l}"></i> ${LNAME[l]}</span><b>${obj(best.w)[l] || 0}</b></div>`).join('')
      + (evs.length ? `<div class="sub" style="margin-top:4px">${evs.slice(0, 5).map(e => `${e.k} ${esc(keyName(e.key || e.token))}`).join('<br>')}</div>` : '');

}

    else if (k === 'range') { const num = el.parentElement.querySelector('[data-kind="num"]'); el.oninput = () => { if (num) num.value = el.value; }; el.onchange = () => { el.blur(); set(el.value); }; }
    else if (k === 'num') el.onchange = () => { el.blur(); if (el.value !== '') set(el.value); };
    else if (k === 'nil') el.onclick = () => set(r.nilv);
    else if (k === 'enum') el.onclick = () => set(el.dataset.v);
    else if (k === 'select') el.onchange = () => { el.blur(); set(el.value); };
    else if (k === 'season') el.onclick = () => {
      const on = new Set([...el.parentElement.querySelectorAll('[data-kind="season"]')].filter(b => b.getAttribute('aria-pressed') === 'true').map(b => b.dataset.v));
      on.has(el.dataset.v) ? on.delete(el.dataset.v) : on.add(el.dataset.v);
      set(SHORT.filter(c => on.has(c)).join('') || 'none');
    };
    else if (k === 'textset') el.onclick = () => set(el.parentElement.querySelector('[data-kind="text"]').value.trim());
  });
}
const FLASH = new Set();
async function setControl(r, v, tok, el) {
  const wire = r.type === 'bool' ? (v ? 'on' : 'off') : String(v);
  const label = r.label + (tok ? ` (${tok})` : '');
  const bad = checkVal(r, wire === 'none' && r.type === 'seasons' ? '' : wire);
  if (bad) { toast(`${label}: ${bad}`); renderActive(); return; }
  const row = el && el.closest('.crow, .swrow');
  if (row) { row.classList.add('pending'); row.querySelectorAll('button,input,select').forEach(x => x.disabled = true); }
  const line = logLine(`set ${r.id}${tok ? ' ' + tok : ''} = ${wire}`);
  try {
    const j = await post('/set', { id: r.id, v: wire, tok });
    line.cmd = j.cmd || line.cmd; line.res = j.ok ? 'done' : 'refused'; line.out = String(j.out ?? '').trim();
    toast(j.ok ? `${label}: ${showVal(r, j.value ?? v)} (read back from the game)` : 'Refused: ' + (line.out.split('\n')[0] || 'unknown'), j.ok);
    if (j.ok) FLASH.add(r.id);
  } catch (e) { line.res = 'failed'; line.out = String(e); toast('Could not reach the game: ' + e.message); }
  renderConsole(); await loadControls(); for (const f of ['state', 'events', 'status', 'waters']) kick(f);
}
function actButtons(acts, preset) {
  return acts.map(a => `<span class="acts" style="gap:4px">${arr(a.arg).length && !preset ? `<select data-arg="${esc(a.id)}" aria-label="${esc(a.label)}: choice">${arr(a.arg).map(o => `<option>${esc(o)}</option>`).join('')}</select>` : ''}<button type="button" class="btn small ${a.confirm ? 'danger' : ''}" data-act="${esc(a.id)}" ${preset && arr(a.arg).includes(preset) ? `data-preset="${esc(preset)}"` : ''} title="${esc(a.help || '')}" ${canSet(a) ? '' : 'disabled'}>${esc(a.label)}</button></span>`).join('');
}
async function runAction(a, arg) {
  if (a.confirm && !window.confirm(`${a.label}${arg ? ' (' + arg + ')' : ''}?\n\n${a.help || ''}`)) return;
  const line = logLine(`${a.label}${arg ? ' ' + arg : ''}`);
  try {
    const j = await post('/act', { id: a.id, arg });
    line.cmd = j.cmd || line.cmd; line.res = j.ok ? 'done' : 'refused'; line.out = String(j.out ?? '').trim();
    st.readouts['act:' + a.id] = { cmd: line.cmd, out: line.out, ok: j.ok };
    toast(j.ok ? (line.out.split('\n')[0] || a.label) : 'Refused: ' + (line.out.split('\n')[0] || 'unknown'));
  } catch (e) { line.res = 'failed'; line.out = String(e); toast('Could not reach the game: ' + e.message); }
  renderConsole(); await loadControls(); for (const f of ['state', 'map', 'events', 'status', 'waters', 'hist']) kick(f);
}
async function runReadout(r) {
  st.readouts[r.id] = { cmd: 'seasonal-wildlife ' + r.verb, out: 'reading…', ok: true }; renderActive();
  try { const j = await post('/read', { id: r.id }); st.readouts[r.id] = { cmd: j.cmd, out: String(j.out ?? ''), ok: j.ok }; }
  catch (e) { st.readouts[r.id] = { cmd: r.verb, out: String(e), ok: false }; }
  renderActive();
}
async function loadControls() {
  try { const j = await getJSON('/controls.json'); ingestControls(j); renderActive(); } catch { /* the state feed reports a lost game */ }
}
function statusNeeded() {
  if (st.tab === 'controls') { const s = arr(CTL && CTL.sections).find(x => x.id === st.csec); return s && s.status ? [s.status] : []; }
  if (st.tab === 'groups') return ['groupmap', 'groups'];
  if (st.tab === 'roster') return ['roster'];
  return [];
}
async function loadStatus(ids, force) {
  const want = [...new Set(ids)].filter(id => id && (force || !STATUS_AT[id] || Date.now() - STATUS_AT[id] > 4500));
  if (!want.length) return;
  const j = await getJSON('/status.json', { s: want.join(',') });
  for (const [id, v] of Object.entries(obj(j.sections))) { STATUS[id] = v; STATUS_AT[id] = Date.now(); }
  if (!editing($('p-' + st.tab))) renderPanel(st.tab);
}
function statusBox(id) {
  const s = STATUS[id];
  if (!s) return '<div class="statusbox"><span class="sub">Reading the status…</span></div>';
  return `<div class="statusbox" role="log">${s.error ? `<span class="err">${esc(s.error)}</span>\n` : ''}${arr(s.lines).map(esc).join('\n') || '<span class="sub">nothing to report</span>'}</div>`;
}
function rowHtml(r) {
  const v = r.value, changed = r.default != null && v != null && !sameVal(v, r.default);
  const fl = FLASH.has(r.id); FLASH.delete(r.id);
  return `<div class="crow ${r.available === false ? 'na' : ''} ${changed ? 'changed' : ''} ${fl ? 'flash' : ''}" data-row="${esc(r.id)}">
    <div class="cl"><b>${esc(r.label)}${r.optin ? ' <span class="chip">opt-in</span>' : ''}${r.available === false ? ' <span class="na-chip">not in this version</span>' : ''}</b>
      ${r.help ? `<span class="h">${esc(r.help)}</span>` : ''}
      <span class="v" title="${esc(r.id)}">${r.verb && !NOVERB.has(r.verb) ? 'seasonal-wildlife ' + esc(r.verb) : esc(r.verb || r.id)}${r.default != null ? ' · default ' + esc(showVal(r, r.default)) : ''}</span></div>
    <div class="cw">${widget(r, v)}${changed && canSet(r) ? `<button type="button" class="reset" data-reset="${esc(r.id)}">reset</button>` : ''}</div></div>`;
}
function actionsHtml(sec) {
  const acts = arr(CTL && CTL.actions).filter(a => a.sec === sec), reads = arr(CTL && CTL.readouts).filter(r => r.sec === sec);
  if (!acts.length && !reads.length) return '';
  const out = [...acts.map(a => 'act:' + a.id), ...reads.map(r => r.id)].map(k => st.readouts[k] ? [k, st.readouts[k]] : null).filter(Boolean);
  return `<div class="panel"><h2>Actions and readouts</h2><div class="acts">${actButtons(acts)}</div>
    ${reads.length ? `<div class="acts" style="margin-top:10px"><span class="sub">Read:</span>${reads.map(r => `<button type="button" class="btn small" data-read="${esc(r.id)}" title="seasonal-wildlife ${esc(r.verb)}" ${r.available === false ? 'disabled' : ''}>${esc(r.label)}</button>`).join('')}</div>` : ''}
    ${out.map(([k, x]) => `<div style="margin-top:8px"><div class="row" style="justify-content:space-between"><span class="mono sub">${esc(x.cmd || '')}</span><button type="button" class="reset" data-close="${esc(k)}">close</button></div><pre class="pre ${x.ok ? '' : 'refuse'}">${esc(x.out || '')}</pre></div>`).join('')}</div>`;
}
function bindActions(P) {
  P.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
    const a = arr(CTL && CTL.actions).find(x => x.id === b.dataset.act), sel = P.querySelector(`[data-arg="${CSS.escape(b.dataset.act)}"]`);
    if (a) runAction(a, b.dataset.preset || (sel ? sel.value : undefined));
  });
  P.querySelectorAll('[data-read]').forEach(b => b.onclick = () => { const r = arr(CTL.readouts).find(x => x.id === b.dataset.read); if (r) runReadout(r); });
  P.querySelectorAll('[data-close]').forEach(b => b.onclick = () => { delete st.readouts[b.dataset.close]; renderActive(); });
  P.querySelectorAll('[data-reset]').forEach(b => b.onclick = () => { const r = CTLBY[b.dataset.reset]; if (r) setControl(r, r.default, null, b); });
}
function switchesPanel() {
  if (!CTL) return '';
  const rows = arr(CTL.controls).filter(r => r.sec === 'switches'), acts = arr(CTL.actions).filter(a => a.sec === 'switches');
  return `<div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h2 style="margin:0">Switches</h2><span class="acts">${actButtons(acts)}<button type="button" class="btn small" data-go="controls/switches">Every control</button></span></div>
    <div class="swgrid">${rows.map(r => `<div class="swrow" title="${esc(r.help || '')}"><span>${esc(r.label)}${r.optin ? ' <span class="sub">(opt-in)</span>' : ''}</span>${widget(r, r.value)}</div>`).join('')}</div></div>`;
}
function renderControls() {
  const P = $('p-controls');
  if (editing(P) && document.activeElement.id !== 'cq') return;
  if (!CTL) { P.innerHTML = '<div class="banner"><span>Reading the control registry from the game…</span></div>'; return; }
  const secs = arr(CTL.sections);
  if (!st.csec || !secs.some(s => s.id === st.csec)) st.csec = secs[0] && secs[0].id;
  const S = secs.find(s => s.id === st.csec) || {}, q = st.cq.trim().toLowerCase(), all = arr(CTL.controls);
  const rows = q ? all.filter(r => (r.label + ' ' + r.id + ' ' + (r.help || '') + ' ' + (r.verb || '')).toLowerCase().includes(q)) : all.filter(r => r.sec === S.id);
  const count = id => all.filter(r => r.sec === id).length;
  const changedIn = id => all.filter(r => r.sec === id && r.default != null && r.value != null && !sameVal(r.value, r.default)).length;
  const groups = [];
  for (const r of rows) { const g = q ? (secs.find(s => s.id === r.sec) || {}).label + (r.grp ? ' · ' + r.grp : '') : (r.grp || ''); let G = groups.find(x => x.name === g); if (!G) groups.push(G = { name: g, rows: [] }); G.rows.push(r); }
  P.innerHTML = `<div class="ctlwrap">
    <nav class="secnav" aria-label="Control sections">${secs.map(s => `<button type="button" data-sec="${esc(s.id)}" aria-current="${!q && s.id === S.id}" title="${esc(s.note || '')}"><span>${esc(s.label)}${s.available === false ? ' <span class="na-chip">n/a</span>' : ''}</span><span class="n">${changedIn(s.id) ? `<span style="color:var(--accent)">${changedIn(s.id)}•</span> ` : ''}${count(s.id)}</span></button>`).join('')}</nav>
    <div style="display:grid;gap:14px;min-width:0">
      <div class="panel" style="display:grid;gap:8px"><div class="row" style="justify-content:space-between"><span class="mono sub">${q ? 'search' : esc(S.id || '')}</span><input class="ctlsearch" id="cq" type="search" placeholder="Find a control" value="${esc(st.cq)}" aria-label="Find a control"></div>
        <h3 style="font-family:var(--serif);font-weight:500;font-size:24px">${q ? `${rows.length} controls match` : esc(S.label || '')}</h3>
        ${q ? '' : `<p class="sub" style="margin:0">${esc(S.note || '')}</p>${statusBox(S.status)}`}
        <p class="sub" style="margin:0">Each change is checked against the control's range, sent as the console verb shown under it and read back from the game; the toast offers Undo (the tool's 50-step undo). A dot marks a value changed from its default.</p></div>
      ${groups.map(G => `<div class="panel">${G.name ? `<h2>${esc(G.name)}</h2>` : ''}${G.rows.map(rowHtml).join('')}</div>`).join('') || '<div class="panel"><p class="sub" style="margin:0">No control matches.</p></div>'}
      ${q ? '' : actionsHtml(S.id)}</div></div>`;
  P.querySelectorAll('[data-sec]').forEach(b => b.onclick = () => { st.csec = b.dataset.sec; st.cq = ''; store.set('csec', st.csec); history.replaceState(null, '', '#controls/' + st.csec); renderControls(); kick('status'); });
  const cq = P.querySelector('#cq');
  cq.oninput = () => { const c = cq.selectionStart; st.cq = cq.value; renderControls(); const n = $('cq'); n.focus(); n.setSelectionRange(c, c); };
  bindWidgets(P, id => CTLBY[id]); bindActions(P); bindLinks(P);
}

// ---------------------------------------------------------------- rendering and boot
const PANELS = { overview: renderOverview, map: renderMap, groups: renderGroups, species: renderSpecies, web: renderWeb, seasons: renderSeasons,
                 roster: renderRoster, waters: renderWaters, controls: renderControls, ledger: renderLedger };
function renderPanel(tab) {
  if (!tab || !PANELS[tab] || tab !== st.tab) return;
  try { PANELS[tab](); } catch (e) { console.error('render ' + tab, e); $('p-' + tab).insertAdjacentHTML('afterbegin', `<div class="banner crit"><span>This tab failed to draw: ${esc(e.message)}</span></div>`); }
}

function renderAll() { renderChrome(); renderLayerSeg(); renderTabs(); renderPanel(st.tab); renderConn(); }
$('q').addEventListener('input', e => { st.q = e.target.value; if (st.tab !== 'species') go('species'); else renderList(); });
document.addEventListener('keydown', e => {
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
  if (e.key === '/') { e.preventDefault(); $('q').focus(); }
  const n = +e.key; if (n >= 1 && n <= 9 && !e.metaKey && !e.ctrlKey) go(TABS[n - 1][0]); if (e.key === '0') go('ledger');

// read-only probe for the live-run kit's browser check (tests/web/live-browser.mjs): what the page holds now
window.SWC = Object.freeze({ snapshot: () => ({ conn: CONN.state, pill: $('conn').textContent, ok: CONN.ok, date: DATE.abs_day, fort: D.fort, release: D.release,
  dfhack: D.dfhack, mock: !!D.mock, units: arr(MAP.live && MAP.live.units).map(u => [u[0], u[1], u[2], u[3]]), groups: arr(MAP.live && MAP.live.groups).length,
  histSeq: HIST.seq, ledSeq: LED.seq, notModified: STATS.notModified, terrain: !!(MAP.terrain && MAP.terrain.done), tab: st.tab }) });
