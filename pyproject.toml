[project]
name = "chronicler"
version = "0.1.0"
description = "AI storyteller and living atlas for Dwarf Fortress"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30.0",
    "pgvector>=0.3.0",
    "lxml>=5.0.0",
    "httpx>=0.27.0",
    "protobuf>=5.0.0",
    "click>=8.1.0",
    "numpy>=1.26.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "jinja2>=3.1.0",
    "sse-starlette>=2.0.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
chronicler = "chronicler.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
