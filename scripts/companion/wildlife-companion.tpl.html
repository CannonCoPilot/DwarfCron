<title>Wildlife Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f1f4f1; --surface:#ffffff; --surface-2:#e8ede9; --surface-3:#dde4df;
  --ink:#16201b; --ink-2:#48574f; --muted:#6f7d75; --line:#d3dbd5; --line-2:#bfc9c2;
  --accent:#5a42b3; --accent-ink:#ffffff; --accent-soft:#ebe7f8;
  --land:#eb6834; --water:#2a78d6; --cavern:#1baf7a;
  --good:#2e7d3f; --warn:#a86f00; --crit:#c2302d;
  --good-soft:#e2f1e5; --warn-soft:#f8eed7; --crit-soft:#f8e1e0;
  --edge:#8b978f;
  --sans:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101412; --surface:#171c19; --surface-2:#1f2622; --surface-3:#29312c;
    --ink:#edf2ee; --ink-2:#b6c2bb; --muted:#8a978f; --line:#2b342f; --line-2:#3a453f;
    --accent:#a595ef; --accent-ink:#15112a; --accent-soft:#2a2545;
    --land:#d95926; --water:#3987e5; --cavern:#199e70;
    --good:#5cb870; --warn:#e0a53a; --crit:#ec6b67;
    --good-soft:#1b2d20; --warn-soft:#33290f; --crit-soft:#3a1c1b;
    --edge:#76837b;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101412; --surface:#171c19; --surface-2:#1f2622; --surface-3:#29312c;
  --ink:#edf2ee; --ink-2:#b6c2bb; --muted:#8a978f; --line:#2b342f; --line-2:#3a453f;
  --accent:#a595ef; --accent-ink:#15112a; --accent-soft:#2a2545;
  --land:#d95926; --water:#3987e5; --cavern:#199e70;
  --good:#5cb870; --warn:#e0a53a; --crit:#ec6b67;
  --good-soft:#1b2d20; --warn-soft:#33290f; --crit-soft:#3a1c1b;
  --edge:#76837b;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:0 64px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1320px;margin:0 auto}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 0;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.fort{display:flex;align-items:baseline;gap:10px;min-width:0}
.fort h1{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1;margin:0;letter-spacing:.01em}
.fort .tool{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.clock{display:flex;align-items:center;gap:10px;color:var(--ink-2)}
.clock svg{flex:none}
.clock b{color:var(--ink);font-weight:600}
.spacer{flex:1}
.conn{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);background:var(--warn-soft);border:1px solid color-mix(in oklab,var(--warn) 35%,transparent);padding:4px 10px;border-radius:999px}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:6px;font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot.land{background:var(--land)} .dot.water{background:var(--water)} .dot.cavern{background:var(--cavern)}
.search{position:relative}
.search input{width:220px;max-width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:6px 10px 6px 30px}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%)}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted);background:var(--surface)}
.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:9px 14px 10px;font-size:14px;font-weight:500;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .count{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:6px}

main{padding-block:20px}
section[role="tabpanel"]{display:grid;gap:20px}
section[role="tabpanel"][hidden]{display:none}
h2{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:0 0 10px;text-wrap:balance}
h3{margin:0;font-size:15px;font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.sub{color:var(--muted);font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.btn{border:1px solid var(--line-2);background:var(--surface);padding:5px 11px;border-radius:7px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* status */
.layers{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.lcard{display:grid;gap:12px}
.lhead{display:flex;align-items:center;gap:8px}
.lhead .chip{margin-left:auto}
.metric{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:baseline}
.metric .lab{color:var(--ink-2);font-size:13px}
.metric .val{font-family:var(--mono);font-size:13px}
.meter{grid-column:1/-1;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;display:flex}
.meter span{display:block;height:100%;border-radius:4px}
.pips{display:flex;gap:4px;grid-column:1/-1}
.pips i{flex:1;height:8px;border-radius:3px;background:var(--surface-2)}
.lnote{font-size:12.5px;color:var(--ink-2);border-top:1px dashed var(--line);padding-top:10px}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.tscroll{overflow-x:auto}
.jobs{display:grid;gap:8px}
.job{display:grid;grid-template-columns:80px 1fr 160px;gap:10px;align-items:center;font-size:13px}
.jbar{position:relative;height:10px;background:var(--surface-2);border-radius:5px}
.jbar .last{position:absolute;left:0;top:0;bottom:0;background:var(--ink-2);border-radius:5px;opacity:.55}
.jbar .worst{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.jbar .budget{position:absolute;top:-5px;bottom:-5px;width:0;border-left:2px dashed var(--muted)}
.boundary{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.blist{display:flex;flex-wrap:wrap;gap:6px}

/* chart */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .axis text{fill:var(--muted);font-size:11px;font-family:var(--mono)}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .lbl{font-size:12px;fill:var(--ink-2);font-family:var(--sans)}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 4px 14px rgb(0 0 0 / .12);min-width:130px;display:none;z-index:5}
.tip .row{display:flex;align-items:center;gap:6px;justify-content:space-between}
.tip .row span:first-child{display:flex;align-items:center;gap:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* species */
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:20px;align-items:start}
@media (max-width:980px){.split{grid-template-columns:1fr}}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.filters select{background:var(--surface);border:1px solid var(--line-2);border-radius:7px;padding:4px 8px;font-size:13px}
.list{max-height:calc(100vh - 250px);min-height:420px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.list table th{position:sticky;top:0;background:var(--surface);z-index:1;cursor:pointer;user-select:none}
.list table th[aria-sort="ascending"]::after{content:" ▲";font-size:9px}
.list table th[aria-sort="descending"]::after{content:" ▼";font-size:9px}
.list tbody tr{cursor:pointer}
.list tbody tr:hover{background:var(--surface-2)}
.list tbody tr[aria-selected="true"]{background:var(--accent-soft)}
.list tbody tr.inactive td:not(:last-child){color:var(--muted)}
.name{display:flex;align-items:center;gap:8px;font-weight:500;white-space:nowrap}
.seasons{display:inline-grid;grid-template-columns:repeat(4,14px);gap:2px}
.seasons i{height:12px;border-radius:2px;background:var(--surface-3)}
.seasons i.on{background:var(--ink-2)}
.seasons i.now{outline:1.5px solid var(--accent);outline-offset:1px}
.switch{position:relative;width:34px;height:20px;border-radius:999px;border:0;background:var(--surface-3);padding:0;flex:none}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgb(0 0 0 / .25);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--good)}
.switch[aria-checked="true"]::after{transform:translateX(14px)}
.detail{position:sticky;top:130px;display:grid;gap:16px}
.dhead{display:grid;gap:4px}
.dhead h3{font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.05;text-transform:capitalize}
.readings{display:flex;flex-wrap:wrap;gap:6px}
.field{display:grid;gap:6px}
.field>label,.field>.lab{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.seasonbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seasonbtns button{border:1px solid var(--line-2);background:var(--surface);padding:7px 4px;border-radius:7px;font-size:13px}
.seasonbtns button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.seasonbtns button.now{box-shadow:inset 0 -3px 0 var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stepper{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden}
.stepper button{border:0;background:var(--surface-2);width:30px}
.stepper input{width:90px;border:0;text-align:center;background:var(--surface);padding:5px;font-family:var(--mono);font-size:13px}
input[type=range]{accent-color:var(--accent);width:100%}
.share{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2)}
.ego{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start}
.ego .col{display:grid;gap:4px;min-width:0}
.ego .col h4{margin:0 0 2px;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.ego .mid{align-self:center;font-family:var(--serif);font-size:18px;text-transform:capitalize;text-align:center;padding:0 4px;max-width:120px}
.elink{border:0;background:var(--surface-2);border-radius:6px;padding:3px 8px;text-align:left;font-size:12.5px;display:flex;align-items:center;gap:6px;min-width:0;text-transform:capitalize}
.elink span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.elink:hover{background:var(--surface-3)}
.elink.live{box-shadow:inset 3px 0 0 var(--accent)}
.more{font-size:12px;color:var(--muted)}
.why{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:8px 10px}
.refuse{font-size:12.5px;color:var(--crit)}

/* food web */
.webbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.webwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:980px){.webwrap{grid-template-columns:1fr}}
.web{overflow:auto;max-height:calc(100vh - 230px);min-height:420px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.web svg{display:block}
.web text{font-size:12px;fill:var(--ink);font-family:var(--sans)}
.web .colhead{font-size:11px;fill:var(--muted);letter-spacing:.06em;font-weight:600}
.web .node{cursor:pointer}
.web .node:hover text{text-decoration:underline}
.web path{fill:none;stroke:var(--edge);stroke-width:1;stroke-opacity:.22}
.web path.live{stroke:var(--accent);stroke-opacity:.55;stroke-width:1.5}
.web.focus path{stroke-opacity:.05}
.web.focus path.on{stroke:var(--accent);stroke-opacity:.95;stroke-width:1.75}
.web.focus .node{opacity:.35}
.web.focus .node.on{opacity:1}
.web.focus .node.on text{font-weight:600}
.guarantee table td,.guarantee table th{text-align:center;padding:6px 4px}
.guarantee table td:first-child,.guarantee table th:first-child{text-align:left}

/* ledger */
.ledger li{display:grid;grid-template-columns:120px 90px 1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline}
.ledger{list-style:none;margin:0;padding:0}
.ledger li:last-child{border-bottom:0}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.settings .field input,.settings .field select{background:var(--surface);border:1px solid var(--line-2);border-radius:7px;padding:5px 8px;width:100%}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center}
.kv label{font-size:13px;color:var(--ink-2)}

/* console */
.console{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line-2);padding-bottom:env(safe-area-inset-bottom,0px)}
.console header{display:flex;align-items:center;gap:10px;padding:8px 16px;cursor:pointer;max-width:1320px;margin:0 auto}
.console header b{font-size:13px}
.console .body{max-height:0;overflow:auto;transition:max-height .2s;max-width:1320px;margin:0 auto;padding:0 16px}
.console.open .body{max-height:220px;padding-bottom:10px}
.console .line{display:grid;grid-template-columns:70px 1fr auto;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line);font-family:var(--mono);font-size:12px;align-items:baseline}
.console .line .c{color:var(--ink);word-break:break-word}
.console .last{font-family:var(--mono);font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.toast{position:fixed;left:50%;bottom:62px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:8px;font-size:13px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1}
.banner{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--ink-2)}
.banner b{color:var(--ink)}
.conn.live{background:var(--good-soft);border-color:color-mix(in oklab,var(--good) 35%,transparent)}
.conn.live i{background:var(--good)}
.conn.lost{background:var(--crit-soft);border-color:color-mix(in oklab,var(--crit) 35%,transparent)}
.conn.lost i{background:var(--crit)}
.web path.vermin{stroke-dasharray:3 3}
.web .fam text{font-style:italic}
.chip.fam{background:transparent;border:1px dashed var(--line-2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:640px){
  .fort h1{font-size:24px}
  .search input{width:100%}
  .search{flex:1 1 100%}
  .job{grid-template-columns:70px 1fr 90px}
  .ledger li{grid-template-columns:1fr auto;}
  .ledger li .k{display:none}
  .boundary{grid-template-columns:1fr}
}
</style>

<div class="wrap">
<div class="top">
  <div class="top-row">
    <div class="fort"><h1 id="fortName">&nbsp;</h1><span class="tool">seasonal-wildlife 6.8</span></div>
    <div class="clock" id="clock"></div>
    <div class="spacer"></div>
    <span class="conn" id="conn"><i></i><span id="connText">Loading</span></span>
  </div>
  <div class="top-row" style="margin-top:12px">
    <div class="seg" role="group" aria-label="Layer" id="layerSeg"></div>
    <div class="spacer"></div>
    <label class="search"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5"/></svg><input id="q" type="search" placeholder="Find a species" aria-label="Find a species"><kbd>/</kbd></label>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
</div>

<main>
  <section role="tabpanel" id="p-status"></section>
  <section role="tabpanel" id="p-species" hidden></section>
  <section role="tabpanel" id="p-web" hidden></section>
  <section role="tabpanel" id="p-ledger" hidden></section>
</main>
</div>

<div class="console" id="console">
  <header id="conHead"><b>Commands</b><span class="chip" id="conCount">0</span><span class="last" id="conLast">Every change on this page becomes one seasonal-wildlife console command.</span><span class="sub">show</span></header>
  <div class="body" id="conBody"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="application/json" id="data">__DATA__</script>
<script>
(() => {
// Two modes, one page. Sample: the data is embedded (the published prototype). Live: the page is served by
// `seasonal-wildlife-web` inside DFHack, reads /state.json every two seconds and sends each change to /cmd as one
// seasonal-wildlife console command. The token in the address authorises both.
const EMBED = JSON.parse(document.getElementById('data').textContent);
const LIVEMODE = EMBED === null;
const TOKEN = new URLSearchParams(location.search).get('t') || '';
const SEASONS = ['Spring', 'Summer', 'Autumn', 'Winter'], SHORT = ['Sp', 'Su', 'Au', 'Wi'];
const LAYERS = ['land', 'water', 'cavern'];
const LNAME = { land: 'Land', water: 'Water', cavern: 'Caverns' };
const FAM = { fish: 'fish', flies: 'flies & biting insects', fliers: 'flying insects', mammals: 'rodents & small mammals',
              soil: 'worms & soil life', colony: 'colony insects', crawlers: 'crawlers' };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = n => Math.round(n).toLocaleString('en-US');
const arr = x => Array.isArray(x) ? x : [];          // DFHack's encoder writes an empty table as {}
const store = { get(k, d) { try { const v = localStorage.getItem('swc.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem('swc.' + k, JSON.stringify(v)); } catch {} } };

// ---- the state, from either source ----
let D, SP = [], BY = {}, eats = {}, eatenBy = {}, onMap = new Set(), GROUPS = [], LIM = {}, JOBS = [], LEDGER = [],
    NOW = 0, DATE = {}, BUDGET = 50, SERIES = [];
function ingest(d) {
  D = d;
  SP = arr(d.species).map(s => ({ ...s, seasons: arr(s.seasons), role: s.role || 'prey' }));
  BY = Object.fromEntries(SP.map(s => [s.key, s]));
  eats = {}; eatenBy = {};
  for (const [p, q] of arr(d.pairs)) { if (!BY[p] || !BY[q]) continue; (eats[p] ||= []).push(q); (eatenBy[q] ||= []).push(p); }

// ---- ui state ----
const st = {
  tab: store.get('tab', 'status'), layer: store.get('layer', 'all'), q: '', sel: null,
  sort: { k: 'name', dir: 1 }, fActive: 'all', fRole: 'all', fHab: 'all', fNow: false,
  webSeason: null, webActive: true, webVermin: true, webFocus: null, conOpen: false, cmds: [], conn: LIVEMODE ? 'loading' : 'sample',
};

// ---- the numbers the tool shows ----
const isVermin = s => s.role === 'vermin';
function inSeason(s, k = NOW) { return s.active && s.seasons.includes(k); }
function pool(layer, season) { return SP.filter(s => s.layer === layer && !isVermin(s) && inSeason(s, season)); }
function share(s, freq = s.freq) {       // ODDS.share: the species' weight over its layer's active in-season species
  if (!s.active || isVermin(s)) return null;
  const k = s.seasons.includes(NOW) ? NOW : s.seasons[0];
  const p = pool(s.layer, k).filter(x => x.key !== s.key);
  const tot = p.reduce((t, x) => t + x.freq, 0) + freq;
  return tot > 0 ? { pct: freq / tot * 100, now: k === NOW } : null;
}
const pct = v => v >= 10 ? v.toFixed(0) + '%' : v.toFixed(1) + '%';
function shareText(s) { const r = share(s); if (!r) return '—'; return r.now ? pct(r.pct) : '(' + pct(r.pct) + ')'; }
const layerOk = s => st.layer === 'all' || s.layer === st.layer;
const nm = s => esc(s.name);

// ---- commands ----
// Sample mode logs what would be sent. Live mode sends it and reads the state back.
async function send(args, what) {
  const cmd = 'seasonal-wildlife ' + args.join(' ');
  const t = new Date().toTimeString().slice(0, 8);
  if (!LIVEMODE) { st.cmds.unshift({ t, cmd, res: 'not sent: sample' }); renderConsole(); toast(what); return; }
  const line = { t, cmd, res: 'sending' }; st.cmds.unshift(line); renderConsole();
  try {
    const q = new URLSearchParams({ t: TOKEN }); for (const a of args) q.append('a', a);
    const r = await fetch('/cmd?' + q.toString(), { method: 'POST' });
    const j = await r.json();
    line.res = j.ok ? 'done' : 'refused'; line.out = (j.out || '').trim();
    toast(j.ok ? (line.out.split('\n')[0] || what) : 'Refused: ' + (line.out || 'unknown'));
  } catch (e) { line.res = 'failed'; line.out = String(e); toast('Could not reach the game: ' + e.message); }
  renderConsole(); refresh(true);
}
function renderConsole() {
  document.getElementById('conCount').textContent = st.cmds.length;
  const last = st.cmds[0];
  document.getElementById('conLast').textContent = last ? last.cmd : 'Every change on this page becomes one seasonal-wildlife console command.';
  const chip = r => r === 'done' ? 'good' : (r === 'refused' || r === 'failed') ? 'crit' : '';
  document.getElementById('conBody').innerHTML = st.cmds.length ? st.cmds.map(c =>
    `<div class="line"><span class="sub">${c.t}</span><span class="c">${esc(c.cmd)}${c.out ? `<br><span class="sub">${esc(c.out.split('\n').slice(0, 3).join(' / '))}</span>` : ''}</span><span class="chip ${chip(c.res)}">${esc(c.res)}</span></div>`).join('')
    : `<p class="sub" style="margin:6px 0">Nothing yet. Change a species, a limit or a group and its command appears here.</p>`;
  document.getElementById('console').classList.toggle('open', st.conOpen);
}
let tt; function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 2600); }
document.getElementById('conHead').onclick = () => { st.conOpen = !st.conOpen; renderConsole(); };

function drawChart() {
  const el = document.getElementById('chart'); if (!el) return;
  const ls = LAYERS.filter(l => layerOk({ layer: l }));
  document.getElementById('legend').innerHTML = ls.map(l => `<span><i class="dot ${l}"></i>${LNAME[l]}</span>`).join('');
  if (SERIES.length < 2) { el.innerHTML = `<p class="sub" style="margin:8px 0">${LIVEMODE ? 'Collecting: the line starts once the game has moved on a little. Unpause to see it grow.' : 'No history.'}</p>`; return; }
  const W = 520, H = 220, m = { l: 34, r: 78, t: 10, b: 24 }, n = SERIES.length;
  const t0 = SERIES[0].t, t1 = SERIES[n - 1].t, span = Math.max(1e-6, t1 - t0);
  const top = Math.max(10, ...SERIES.flatMap(p => ls.map(l => p[l])));
  const ymax = Math.ceil(top / 20) * 20, ticks = [0, ymax / 4, ymax / 2, ymax * 3 / 4, ymax];
  const x = t => m.l + (t - t0) / span * (W - m.l - m.r), y = v => H - m.b - v / ymax * (H - m.t - m.b);
  let g = '<g class="grid">' + ticks.map(v => `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/>`).join('') + '</g>';
  const daysAgo = t => { const d = t1 - t; return d < 0.05 ? 'now' : d < 1 ? '-' + Math.round(d * 24) + ' h' : '-' + d.toFixed(d < 10 ? 1 : 0) + ' d'; };
  g += '<g class="axis">' + ticks.map(v => `<text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${Math.round(v)}</text>`).join('')
     + [0, 0.25, 0.5, 0.75, 1].map(f => `<text x="${x(t0 + f * span)}" y="${H - 6}" text-anchor="middle">${daysAgo(t0 + f * span)}</text>`).join('') + '</g>';
  const ends = [];
  for (const l of ls) {
    g += `<path d="${SERIES.map((p, i) => (i ? 'L' : 'M') + x(p.t).toFixed(1) + ' ' + y(p[l]).toFixed(1)).join(' ')}" fill="none" stroke="var(--${l})" stroke-width="2" stroke-linejoin="round"/>`;
    const last = SERIES[n - 1][l];
    g += `<circle cx="${x(t1)}" cy="${y(last)}" r="4" fill="var(--${l})" stroke="var(--surface)" stroke-width="2"/>`;
    ends.push({ l, y: y(last), v: last });
  }
  ends.sort((a, b) => a.y - b.y); for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 14) ends[i].y = ends[i - 1].y + 14;
  g += ends.map(e => `<text class="lbl" x="${x(t1) + 9}" y="${e.y + 4}">${LNAME[e.l]} ${e.v}</text>`).join('');
  g += `<line id="xh" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}" stroke="var(--muted)" stroke-dasharray="3 3" opacity="0"/>`;
  g += `<rect x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" fill="transparent" id="hit"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Wild animals on the map per layer over time">${g}</svg><div class="tip" id="tip"></div>`;
  const svg = el.querySelector('svg'), tip = el.querySelector('#tip'), xh = el.querySelector('#xh');
  el.querySelector('#hit').addEventListener('pointermove', ev => {
    const r = svg.getBoundingClientRect(), sx = (ev.clientX - r.left) / r.width * W, tt_ = t0 + (sx - m.l) / (W - m.l - m.r) * span;
    let i = 0; for (let k = 1; k < n; k++) if (Math.abs(SERIES[k].t - tt_) < Math.abs(SERIES[i].t - tt_)) i = k;
    const p = SERIES[i];
    xh.setAttribute('x1', x(p.t)); xh.setAttribute('x2', x(p.t)); xh.setAttribute('opacity', 1);
    tip.innerHTML = `<div class="sub" style="margin-bottom:4px">${daysAgo(p.t) === 'now' ? 'Now' : daysAgo(p.t).slice(1) + ' ago'}</div>` + ls.map(l => `<div class="row"><span><i class="dot ${l}"></i>${LNAME[l]}</span><b class="num">${p[l]}</b></div>`).join('');
    tip.style.display = 'block';
    const px = x(p.t) / W * r.width; tip.style.left = Math.min(px + 12, r.width - 150) + 'px'; tip.style.top = '8px';
  });
  el.querySelector('#hit').addEventListener('pointerleave', () => { tip.style.display = 'none'; xh.setAttribute('opacity', 0); });
}

// ---- Species ----
const HABS = ['land', 'flier', 'waterbird', 'semiaquatic', 'aquatic'];
const BAND = { small: 0, medium: 1, large: 2 };
function filtered() {
  const q = st.q.trim().toLowerCase();
  let a = SP.filter(s => layerOk(s)
    && (st.fActive === 'all' || (st.fActive === 'active') === s.active)
    && (st.fRole === 'all' || s.role === st.fRole)
    && (st.fHab === 'all' || s.habitat === st.fHab)
    && (!st.fNow || inSeason(s))
    && (!q || s.name.toLowerCase().includes(q) || s.token.toLowerCase().includes(q) || (s.family && FAM[s.family].includes(q))));
  const k = st.sort.k, d = st.sort.dir;
  const val = s => k === 'name' ? s.name : k === 'stock' ? s.stock : k === 'odds' ? (share(s)?.pct ?? -1) : k === 'size' ? (BAND[s.band] ?? -1) : k === 'seasons' ? s.seasons.length : k === 'active' ? +s.active : s[k];
  a.sort((x, y) => { const u = val(x), v = val(y); return (u < v ? -1 : u > v ? 1 : 0) * d || x.name.localeCompare(y.name); });
  return a;
}

// ---- Food web ----
// Species are nodes; vermin are drawn one node per family and layer (the Vermin tab's unit), since DF treats a
// family alike and a web of every gnat would bury the animals. Dashed: a vermin hunter and what it can take.
const famId = s => `fam:${s.layer}:${s.family}`;
function renderWeb() {
  const P = document.getElementById('p-web');
  if (st.webSeason === null) st.webSeason = NOW;
  const pass = s => layerOk(s) && (!st.webActive || s.active) && (st.webSeason === 'any' || !st.webActive || s.seasons.includes(+st.webSeason));
  const vis = SP.filter(s => pass(s) && (!isVermin(s) || st.webVermin));
  const vk = new Set(vis.map(s => s.key));
  // nodes: species, and one per vermin family
  const nodes = new Map();
  for (const s of vis) {
    if (!isVermin(s)) { nodes.set(s.key, { id: s.key, s, name: s.name, layer: s.layer, role: s.role, habitat: s.habitat, band: s.band, live: onMap.has(s.key) }); continue; }
    const id = famId(s);
    if (!nodes.has(id)) nodes.set(id, { id, fam: s.family, name: `${FAM[s.family] || s.family}`, layer: s.layer, role: 'vermin', members: [], habitat: 'zz', band: 'small', live: false });
    nodes.get(id).members.push(s);
  }
  const seen = new Set(), edges = [];
  for (const [p, q] of arr(D.pairs)) {
    if (!vk.has(p) || !vk.has(q)) continue;
    const to = isVermin(BY[q]) ? famId(BY[q]) : q, k = p + '>' + to;
    if (seen.has(k)) continue; seen.add(k);
    edges.push({ p, q: to, vermin: isVermin(BY[q]), live: onMap.has(p) && onMap.has(q) });
  }
  const used = new Set(edges.flatMap(e => [e.p, e.q]));
  const HO = { flier: 0, waterbird: 1, land: 2, semiaquatic: 3, aquatic: 4, zz: 9 };
  const ord = (a, b) => (a.layer > b.layer ? 1 : a.layer < b.layer ? -1 : 0) || (HO[a.habitat] ?? 5) - (HO[b.habitat] ?? 5) || (BAND[b.band] ?? 0) - (BAND[a.band] ?? 0) || a.name.localeCompare(b.name);
  const all = [...nodes.values()];
  const preds = all.filter(n => n.role === 'predator' && used.has(n.id)).sort(ord);
  const prey = all.filter(n => n.role !== 'predator' && used.has(n.id)).sort(ord);
  const alone = vis.filter(s => !isVermin(s) && !used.has(s.key));
  const g = LAYERS.map(l => [0, 1, 2, 3].map(k => arr(D.pairs).some(([p, q]) => BY[p] && BY[q] && !isVermin(BY[q]) && BY[p].layer === l && BY[q].layer === l && inSeason(BY[p], k) && inSeason(BY[q], k))));
  const RH = 20, top = 36, W = 700, colL = 200, colR = W - 240;
  const H = top + Math.max(preds.length, prey.length, 1) * RH + 12;
  const yP = new Map(preds.map((n, i) => [n.id, top + i * RH + RH / 2]));
  const yQ = new Map(prey.map((n, i) => [n.id, top + i * RH + RH / 2]));
  const svgEdges = edges.map(e => { const y1 = yP.get(e.p), y2 = yQ.get(e.q);
    return `<path data-p="${esc(e.p)}" data-q="${esc(e.q)}" class="${e.live ? 'live' : ''} ${e.vermin ? 'vermin' : ''}" d="M${colL} ${y1} C ${(colL + colR) / 2} ${y1}, ${(colL + colR) / 2} ${y2}, ${colR} ${y2}"/>`; }).join('');
  const label = n => { const t = n.fam ? `${n.name} (${n.members.length})` : n.name; const cap = n.fam ? 34 : 26; return esc(t.length > cap ? t.slice(0, cap - 1) + '…' : t); };
  const node = (n, x, y, anchor) => `<g class="node ${n.fam ? 'fam' : ''}" data-key="${esc(n.id)}" tabindex="0" role="button" aria-label="${esc(n.name)}">${n.fam
      ? `<rect x="${x - 4}" y="${y - 4}" width="8" height="8" rx="1.5" fill="none" stroke="var(--${n.layer})" stroke-width="2"/>`
      : `<circle cx="${x}" cy="${y}" r="${n.live ? 5 : 4}" fill="var(--${n.layer})" ${n.live ? 'stroke="var(--accent)" stroke-width="2"' : ''}/>`}<text x="${anchor === 'end' ? x - 10 : x + 10}" y="${y + 4}" text-anchor="${anchor}" style="text-transform:${n.fam ? 'none' : 'capitalize'}">${label(n)}</text></g>`;
  const svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Food web: predators on the left, prey and vermin on the right">
    <text class="colhead" x="${colL - 10}" y="20" text-anchor="end">PREDATORS (${preds.length})</text><text class="colhead" x="${colR + 10}" y="20">PREY AND VERMIN (${prey.length})</text>
    ${svgEdges}${preds.map(n => node(n, colL, yP.get(n.id), 'end')).join('')}${prey.map(n => node(n, colR, yQ.get(n.id), 'start')).join('')}</svg>`;
  const nv = edges.filter(e => e.vermin).length;
  P.innerHTML = `
    <div class="webbar">
      <div class="seg" role="group" aria-label="Season" id="webSeason">${[0, 1, 2, 3].map(k => `<button type="button" data-s="${k}" aria-pressed="${String(st.webSeason) === String(k)}">${SEASONS[k]}${k === NOW ? ' (now)' : ''}</button>`).join('')}<button type="button" data-s="any" aria-pressed="${st.webSeason === 'any'}">Any season</button></div>
      <label class="chip" style="cursor:pointer"><input type="checkbox" id="webActive" ${st.webActive ? 'checked' : ''} style="margin:0"> Active species only</label>
      <label class="chip" style="cursor:pointer"><input type="checkbox" id="webVermin" ${st.webVermin ? 'checked' : ''} style="margin:0"> Vermin</label>
      <span class="sub">${edges.length - nv} pairs${st.webVermin ? `, ${nv} vermin links (dashed)` : ''} &middot; <span style="color:var(--accent)">violet</span>: both on the map now</span>
    </div>
    ${st.webVermin && nv && !D.hunting ? `<div class="banner"><span><b>Vermin hunting is off.</b> The dashed links are what these hunters would take once it is switched on (Panel, or <span class="mono">seasonal-wildlife hunting on</span>). DF only lets a species with the hunting flag catch vermin.</span></div>` : ''}
    <div class="webwrap">
      <div class="web ${st.webFocus ? 'focus' : ''}" id="web">${edges.length ? svg : '<p class="sub" style="padding:16px">No predator and prey meet under these filters.</p>'}</div>
      <div style="display:grid;gap:16px">
        <div class="panel" id="webSide"></div>
        <div class="panel guarantee"><h2>Pair guarantee</h2><p class="sub" style="margin:0 0 8px">Every season of every layer should hold an active predator and a prey it eats. Vermin do not count.</p>
          <table><thead><tr><th></th>${SHORT.map(x => `<th>${x}</th>`).join('')}</tr></thead><tbody>${LAYERS.map((l, gi) => `<tr><td><span class="dot ${l}"></span> ${LNAME[l]}</td>${g[gi].map(ok => `<td>${ok ? '<span class="chip good" title="Holds a pair">✓</span>' : '<span class="chip crit" title="No pair this season">✗</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
        ${alone.length ? `<div class="panel"><h2>No partner here (${alone.length})</h2><div class="blist">${alone.slice(0, 16).map(s => `<button class="elink" data-go="${esc(s.key)}"><span class="dot ${s.layer}"></span><span class="t">${nm(s)}</span></button>`).join('')}${alone.length > 16 ? `<span class="more">+${alone.length - 16} more</span>` : ''}</div></div>` : ''}
      </div></div>`;
  P.querySelectorAll('#webSeason button').forEach(b => b.onclick = () => { st.webSeason = b.dataset.s === 'any' ? 'any' : +b.dataset.s; renderWeb(); });
  P.querySelector('#webActive').onchange = e => { st.webActive = e.target.checked; renderWeb(); };
  P.querySelector('#webVermin').onchange = e => { st.webVermin = e.target.checked; renderWeb(); };
  P.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go('species', b.dataset.go));
  const web = P.querySelector('#web');
  const focus = id => {
    const on = new Set(id ? [id] : []);
    web.classList.toggle('focus', !!id);
    web.querySelectorAll('path').forEach(p => { const hit = id && (p.dataset.p === id || p.dataset.q === id); p.classList.toggle('on', !!hit); if (hit) { on.add(p.dataset.p); on.add(p.dataset.q); } });
    web.querySelectorAll('.node').forEach(n => n.classList.toggle('on', on.has(n.dataset.key)));
    side(id);
  };
  const side = id => {
    const el = P.querySelector('#webSide'), n = id && nodes.get(id);
    if (!n) { el.innerHTML = `<h2>Trace a species</h2><p class="sub" style="margin:0">Hover a name to see what it eats and what eats it. Click to keep it selected. Squares are vermin families.</p>`; return; }
    const hunters = [...new Set(edges.filter(e => e.q === id).map(e => e.p))];
    if (n.fam) {
      el.innerHTML = `<span class="mono sub">vermin &middot; ${LNAME[n.layer] || n.layer}</span><h3 style="font-family:var(--serif);font-weight:400;font-size:24px;margin:2px 0 8px">${esc(n.name)}</h3>
        <div class="field"><span class="lab">Species (${n.members.length})</span><div class="blist">${egoList(n.members.map(m => m.key), 14)}</div></div>
        <div class="field" style="margin-top:10px"><span class="lab">Hunted by (${hunters.length})</span><div class="blist">${egoList(hunters, 14)}</div></div>

          <label for="c-${l}">Ceiling</label><input id="c-${l}" type="number" min="0" max="400" value="${L.ceiling ?? 0}" data-l="${l}" data-f="ceiling">
          <label for="p-${l}">Pattern</label><select id="p-${l}" data-l="${l}" data-f="pattern">${['steady', 'burst', 'trickle', 'dawn', 'follow'].map(p => `<option ${p === L.pattern ? 'selected' : ''}>${p}</option>`).join('')}</select></div></div>`; }).join('')}</div>
      <p class="sub" style="margin:10px 0 0">Groups at once: how many wild groups a layer holds. Ceiling: the most wild animals of that layer on the map; 0 is none.</p></div></div>`;
  P.querySelector('#undo').onclick = () => send(['undo'], 'Undid the last edit');
  P.querySelectorAll('[data-f]').forEach(inp => inp.onchange = () => {
    const l = inp.dataset.l, f = inp.dataset.f, L = LIM[l] || (LIM[l] = {});
    inp.blur();
    if (f === 'pattern') { if (!LIVEMODE) L.pattern = inp.value; send(['pattern', l, inp.value], `${LNAME[l]}: ${inp.value} pattern`); }
    else { const v = Math.max(f === 'ceiling' ? 0 : 1, Math.round(+inp.value || 0)); if (!LIVEMODE) L[f] = v; send(['limits', l, f, String(v)], `${LNAME[l]}: ${f === 'groups' ? 'groups at once' : 'ceiling'} ${v}`); }
  });
}

function renderAll() { renderChrome(); renderLayerSeg(); renderTabs(); renderStatus(); renderSpecies(); renderWeb(); renderLedger(); }
document.getElementById('q').addEventListener('input', e => { st.q = e.target.value; if (st.tab !== 'species') { st.tab = 'species'; renderTabs(); } renderList(); });
document.addEventListener('keydown', e => {
  if (e.key === '/' && !['INPUT', 'SELECT'].includes(document.activeElement.tagName)) { e.preventDefault(); document.getElementById('q').focus(); }
  if (st.tab === 'species' && ['ArrowDown', 'ArrowUp'].includes(e.key) && !['INPUT', 'SELECT'].includes(document.activeElement.tagName)) {
    const a = filtered(), i = a.findIndex(s => s.key === st.sel); const j = Math.max(0, Math.min(a.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)));
    if (a[j]) { e.preventDefault(); st.sel = a[j].key; renderList(); renderDetail(); document.querySelector(`#list tr[data-key="${CSS.escape(st.sel)}"]`)?.scrollIntoView({ block: 'nearest' }); }
  }
});
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(drawChart, 150); });

// ---- boot ----
let lastText = '';
async function refresh(force) {
  if (!LIVEMODE || (document.hidden && !force)) return;
  try {
    const r = await fetch('/state.json?t=' + encodeURIComponent(TOKEN), { cache: 'no-store' });
    if (r.status === 403) { st.conn = 'lost'; toast('The token in this address is not the one the game gave. Run seasonal-wildlife-web status for the current address.'); return; }
    const text = await r.text();
    const was = st.conn; st.conn = 'live';
    if (text === lastText && was === 'live') return;          // nothing moved: leave the page as it is
    lastText = text;
    const d = JSON.parse(text);
    if (!d.loaded) { D = { fort: 'No fort loaded', species: [] }; ingest({ fort: 'No fort loaded' }); renderAll(); return; }
    ingest(d); renderAll();
  } catch (e) { if (st.conn !== 'lost') { st.conn = 'lost'; renderChrome(); } }
}
renderConsole();
if (LIVEMODE) { ingest({ fort: 'Connecting', species: [] }); renderAll(); refresh(true); setInterval(refresh, 2000); }
else { ingest(EMBED); renderAll(); }
})();
</script>
